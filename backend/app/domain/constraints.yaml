registry_version: constraints-1.0.0
units_allowed: [c, bar, s, h, mm, mm_s, pct, ton, g, cm2, days, rpm, g_10min, dimensionless]

resin_grades:
  PP-H:
    name: "Polypropylene Homopolymer"
    melt_window_c: [200, 260]
    degradation_ceiling_c: 285
    moisture_spec_max_pct: 0.10
    moisture_critical_factor: 2.0
    mfi_nominal: 12.0
    density_g_cm3: 0.905
    provenance: specification_derived
    citation: "ISO 1873-1 / Technical Data Sheet PP-H"
  PP-C:
    name: "Polypropylene Impact Copolymer"
    melt_window_c: [190, 250]
    degradation_ceiling_c: 275
    moisture_spec_max_pct: 0.12
    moisture_critical_factor: 2.0
    mfi_nominal: 15.0
    density_g_cm3: 0.900
    provenance: specification_derived
    citation: "ISO 1873-1 / Technical Data Sheet PP-C"

