coupling_rules:
  - id: CPL-001
    description: "hold_pressure_bar <= inj_pressure_bar"
    params: [hold_pressure_bar, inj_pressure_bar]
    severity: CRITICAL
    message: "Holding pressure cannot exceed injection pressure"
  - id: CPL-002
    description: "melt_temp_c >= mold_temp_c + 120"
    params: [melt_temp_c, mold_temp_c]
    constants: {melt_mold_delta_min_c: 120.0}
    severity: CRITICAL
    message: "Melt temperature must exceed mold temperature by at least 120 °C to prevent premature freezing"
  - id: CPL-003
    description: "clamp_force_ton <= max_clamp_force_ton"
    params: [clamp_force_ton]
    severity: CRITICAL
    message: "Requested clamp force exceeds the machine's maximum rated tonnage"
  - id: CPL-004
    description: "inj_pressure_bar <= max_inj_pressure_bar"
    params: [inj_pressure_bar]
    severity: CRITICAL
    message: "Requested injection pressure exceeds the machine's maximum hydraulic limit"

hard_constraints:
  - id: HC-001
    stage: PLASTICIZING
    blocks_stage: true
    severity_in_simulation: CRITICAL
    enforced_in_guard: true
    description: "Melt temperature above resin degradation ceiling (PP-H: 285 °C) causes polymer chain scission"
  - id: HC-002
    stage: INJECTION
    blocks_stage: true
    severity_in_simulation: CRITICAL
    enforced_in_guard: true
    description: "Clamping force must be >= required clamping force calculated from cavity pressure and projected area"
  - id: HC-003
    stage: INJECTION
    blocks_stage: false
    severity_in_simulation: WARNING
    enforced_in_guard: true
    description: "Injection pressure should remain <= 90% of maximum machine injection pressure for safety headroom"
  - id: HC-004
    stage: COOLING
    blocks_stage: false
    severity_in_simulation: WARNING
    enforced_in_guard: true
    description: "Cooling time must meet minimum required cooling estimate to prevent part warping during ejection"
  - id: HC-005
    stage: PACKING
    blocks_stage: false
    severity_in_simulation: WARNING
    enforced_in_guard: true
    description: "Cushion position must be within 2.0 mm and 15.0 mm to ensure packing pressure transfer"
  - id: HC-006
    stage: MATERIAL_CONDITIONING
    blocks_stage: true
    severity_in_simulation: CRITICAL
    enforced_in_guard: true
    description: "Moisture content above 2x specification limit causes severe splay marks and hydrolytic degradation"

stage_checks:
  MATERIAL_CONDITIONING:
    - {check_id: S1-MOIST, type: range, target: moisture_pct, weight: 0.40, provenance: heuristic}
    - {check_id: S1-MFIZ, type: zscore, target: mfi, weight: 0.25, provenance: heuristic}
    - {check_id: S1-DRYING, type: range, target: drying_time_h, weight: 0.20, provenance: heuristic}
    - {check_id: S1-REGRIND, type: range, target: regrind_pct, weight: 0.15, provenance: heuristic}
  PLASTICIZING:
    - {check_id: S2-MELT, type: range, target: melt_temp_c, weight: 0.35, provenance: heuristic}
    - {check_id: S2-GRADIENT, type: profile, target: barrel_temp_rear_c, weight: 0.25, provenance: heuristic}
    - {check_id: S2-BACKPRESS, type: range, target: back_pressure_bar, weight: 0.20, provenance: heuristic}
    - {check_id: S2-RPM, type: range, target: screw_rpm, weight: 0.20, provenance: heuristic}
  INJECTION:
    - {check_id: S3-VELOCITY, type: range, target: inj_velocity_mm_s, weight: 0.30, provenance: heuristic}
    - {check_id: S3-PRESSURE, type: range, target: inj_pressure_bar, weight: 0.35, provenance: heuristic}
    - {check_id: S3-CLAMP, type: safety, target: clamp_force_ton, weight: 0.35, provenance: heuristic}
  PACKING:
    - {check_id: S4-HOLD_P, type: range, target: hold_pressure_bar, weight: 0.35, provenance: heuristic}
    - {check_id: S4-HOLD_T, type: range, target: hold_time_s, weight: 0.30, provenance: heuristic}
    - {check_id: S4-CUSHION, type: range, target: cushion_mm, weight: 0.35, provenance: heuristic}
  COOLING:
    - {check_id: S5-COOL_T, type: range, target: cooling_time_s, weight: 0.45, provenance: heuristic}
    - {check_id: S5-MOLD_T, type: range, target: mold_temp_c, weight: 0.35, provenance: heuristic}
    - {check_id: S5-CYCLE_BAL, type: balance, target: cycle_time_s, weight: 0.20, provenance: heuristic}

risk_bands:
  stage_health:
    NORMAL: 0.90
    LOW: 0.70
    MEDIUM: 0.50
    HIGH: 0.30
  p_fail:
    LOW: 0.10
    MEDIUM: 0.30
    HIGH: 0.50
    CRITICAL: 0.85

recommendation:
  default_max_changes: 3
  coordinate_levels: 7
  pairwise_top_k: 3
  stability_trials: 20
  stability_noise_fraction_of_step: 0.5
  max_unstable_flip_rate: 0.20
  weights:
    w1_improvement: 1.0
    w2_change_cost: 0.15
    w3_instability: 0.5
    w4_extrapolation: 0.5
    w5_cycle_time: 0.2
  cycle_time_follows_stage_times: true
