remedies_version: remedies-1.0.0

rules:
  - id: REM-001
    defect_target: short_shot
    stage: INJECTION
    condition: "fill_time_s < 0.8 or inj_pressure_bar < 600 or melt_temp_c < 210"
    actions:
      - parameter: inj_velocity_mm_s
        direction: increase
        step_fraction: 0.5
        rationale: "Increase injection velocity to reduce melt cooling before cavity filling is complete"
      - parameter: inj_pressure_bar
        direction: increase
        step_fraction: 0.5
        rationale: "Increase available injection pressure to overcome flow resistance"
      - parameter: melt_temp_c
        direction: increase
        step_fraction: 0.3
        rationale: "Higher melt temperature reduces viscosity and flow resistance"

  - id: REM-002
    defect_target: flash
    stage: INJECTION
    condition: "inj_pressure_bar > 1400 or clamp_force_ton < 90"
    actions:
      - parameter: clamp_force_ton
        direction: increase
        step_fraction: 0.5
        rationale: "Increase clamping force to counteract cavity pressure pushing parting line open"
      - parameter: hold_pressure_bar
        direction: decrease
        step_fraction: 0.4
        rationale: "Reduce holding pressure to prevent over-packing the parting line"
      - parameter: switchover_position_mm
        direction: increase
        step_fraction: 0.3
        rationale: "Switch to pressure control earlier to avoid pressure spikes"

  - id: REM-003
    defect_target: sink_marks_voids
    stage: PACKING
    condition: "hold_pressure_bar < 450 or hold_time_s < 3.0"
    actions:
      - parameter: hold_pressure_bar
        direction: increase
        step_fraction: 0.5
        rationale: "Increase holding pressure to pack additional melt into thick sections"
      - parameter: hold_time_s
        direction: increase
        step_fraction: 0.5
        rationale: "Extend holding time until gate freeze occurs"
      - parameter: cushion_mm
        direction: increase
        step_fraction: 0.3
        rationale: "Ensure sufficient cushion remains so screw doesn't bottom out"

  - id: REM-004
    defect_target: warpage
    stage: COOLING
    condition: "cooling_time_s < 8.0 or mold_temp_c > 55"
    actions:
      - parameter: cooling_time_s
        direction: increase
        step_fraction: 0.6
        rationale: "Allow part to cool further below glass transition/ejection temperature in mold"
      - parameter: mold_temp_c
        direction: decrease
        step_fraction: 0.4
        rationale: "Lower mold temperature speeds up core solidification and reduces thermal gradient"

  - id: REM-005
    defect_target: splay_silver_streaks
    stage: MATERIAL_CONDITIONING
    condition: "moisture_pct > 0.08"
    actions:
      - parameter: drying_time_h
        direction: increase
        step_fraction: 0.5
        rationale: "Increase desiccant drying duration to remove residual moisture"
      - parameter: dryer_temp_c
        direction: increase
        step_fraction: 0.3
        rationale: "Elevate drying hopper temperature closer to polymer recommended drying band"

  - id: REM-006
    defect_target: thermal_degradation
    stage: PLASTICIZING
    condition: "melt_temp_c > 260 or residence_time_s > 60"
    actions:
      - parameter: melt_temp_c
        direction: decrease
        step_fraction: 0.5
        rationale: "Lower barrel and melt temperatures to prevent molecular weight reduction"
      - parameter: back_pressure_bar
        direction: decrease
        step_fraction: 0.4
        rationale: "Reduce back pressure to decrease viscous shear heating"
